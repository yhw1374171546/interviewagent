name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # 只装测试所需的最小依赖（LLM SDK 懒加载，测试/基准不需要真实 API）
      # pytest-asyncio: test_agent.py 使用 @pytest.mark.asyncio 标记
      # pytest-cov: 覆盖率门禁（核心模块 interview + core，阈值 80%）
      - name: Install dependencies
        run: pip install pytest pytest-asyncio pytest-cov rich python-dotenv

      - name: Run tests (with coverage gate)
        run: python -m pytest tests/ -v --cov=interview --cov=core --cov-fail-under=80

      - name: Run benchmark
        run: python benchmark.py

      - name: Run demo (offline smoke test)
        run: python demo.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .
