<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试模拟 Agent</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ══════════════ 聊天页（唯一视图，DeepSeek 式：侧边栏历史常驻） ══════════════ -->
<div id="chat-app" class="chat-app">

  <!-- 左侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <button id="new-interview-btn" class="btn-new">＋ 开始新面试</button>
    </div>
    <div id="history-list" class="history-list"></div>
    <div class="sidebar-footer" id="mock-banner" hidden>
      <span class="mock-dot"></span> 演示模式（Mock LLM）
    </div>
  </aside>

  <!-- 主聊天区 -->
  <main class="chat-main">
    <header class="chat-header">
      <div class="chat-title" id="chat-title">面试模拟</div>
      <div class="chat-progress" id="chat-progress"></div>
    </header>

    <!-- 新建面试面板（未选中会话时显示） -->
    <section id="new-interview-panel" class="new-interview-panel">
      <div class="panel-inner">
        <div class="panel-logo">
          <div class="logo-icon">🎙️</div>
          <h1>AI 面试模拟</h1>
          <p class="subtitle">上传简历或粘贴文本，Agent 将围绕你的内容进行全真模拟面试</p>
        </div>

        <div class="landing-card">
          <textarea id="resume-text" class="resume-textarea"
            placeholder="在此粘贴简历内容或岗位 JD……&#10;&#10;示例：&#10;Java 后端开发工程师&#10;求职意向：Java 开发工程师&#10;技术栈：Spring Boot、MySQL、Redis、Kafka……"></textarea>

          <div class="divider"><span>或</span></div>

          <div id="drop-zone" class="drop-zone">
            <input type="file" id="file-input" accept=".pdf" hidden>
            <div class="drop-icon">📄</div>
            <div class="drop-text">点击或拖拽上传 PDF 简历</div>
            <div id="file-name" class="file-name"></div>
          </div>

          <button id="start-btn" class="btn-primary">开始对话</button>
          <div id="landing-error" class="error-msg" hidden></div>
        </div>
      </div>
    </section>

    <div id="messages" class="messages" hidden></div>

    <footer class="composer" hidden>
      <div class="composer-box">
        <textarea id="answer-input" class="answer-input" rows="1"
          placeholder="输入你的回答…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="skip-btn" class="btn-skip" title="跳过当前题">跳过</button>
        <button id="send-btn" class="btn-send" title="发送">➤</button>
      </div>
      <div class="composer-hint" id="composer-hint"></div>
    </footer>
  </main>
</div>

<!-- 删除确认弹窗 -->
<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-title">删除面试记录</div>
    <div class="modal-body">确定要删除「<span id="modal-name"></span>」吗？删除后无法恢复。</div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn-secondary">取消</button>
      <button id="modal-confirm" class="btn-danger">删除</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
